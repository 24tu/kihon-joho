<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>基本情報 科目A</title>
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#eef0f3;--card:#fff;--ink:#1b1f24;--sub:#5d6670;--line:#dfe3e8;--acc:#1d5fd1;--ok:#14894e;--okbg:#e6f5ec;--ng:#c8323a;--ngbg:#fbe9ea;--car:#b45309;--carbg:#fff4e5;--top:#14213d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
.top{background:var(--top);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:2}
.top .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.9}
.top h1{font-size:17px;margin:4px 0 8px}
.bar{height:6px;background:#ffffff33;border-radius:3px}.bar i{display:block;height:100%;background:#ffd166;border-radius:3px;transition:width .3s}
main{max-width:560px;margin:0 auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.tag{display:inline-block;font-size:12px;background:#dde7fb;color:var(--acc);padding:2px 8px;border-radius:10px;margin:0 4px 4px 0}
.q{font-size:16px;line-height:1.75;margin:6px 0 0}
.ch{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;font:inherit;font-size:15px;line-height:1.6;color:inherit;cursor:pointer}
.ch:disabled{cursor:default;opacity:1}
.ch>b{flex:none;width:26px;height:26px;border-radius:50%;background:#eef1f5;display:grid;place-items:center;font-size:14px}
.ch.ok{border-color:var(--ok);background:var(--okbg)}.ch.ok>b{background:var(--ok);color:#fff}
.ch.ng{border-color:var(--ng);background:var(--ngbg)}.ch.ng>b{background:var(--ng);color:#fff}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-align:center}
.btn.sub{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
.btn:disabled{background:#b8c2d0;cursor:default}
.nav{display:flex;gap:8px;margin-top:4px}
.res{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:700}
.res span{font-size:28px;line-height:1}.res small{font-weight:400;display:block}
.res.ok{background:var(--okbg);color:var(--ok)}.res.ng{background:var(--ngbg);color:var(--ng)}
h2{font-size:14px;margin:0 0 8px}
.one{font-size:16px;line-height:1.75;font-weight:700;margin:0}
.one em{font-style:normal;background:linear-gradient(transparent 60%,#ffe08a 60%)}
.card p{margin:6px 0;line-height:1.75;font-size:14.5px}
.mute{color:var(--sub);font-size:13px!important}
.car{background:var(--carbg);border-color:#f6d7a8}.car h2{color:var(--car)}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
details summary h2{display:inline}details summary::after{content:"▾ ひらく";float:right;font-size:12px;color:var(--sub)}
details[open] summary::after{content:"▴ とじる"}
.why div{display:flex;gap:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px;line-height:1.65}
.why div:first-of-type{border-top:0}
.why div>b{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:#eef1f5}
.why .o>b{background:var(--ok);color:#fff}
.why .me>b{background:var(--ng);color:#fff}
.words span{display:inline-block;font-size:13px;border:1px solid var(--line);border-radius:14px;padding:3px 10px;margin:0 4px 6px 0;background:#fafbfc}
.src{font-size:11.5px;color:var(--sub);text-align:center;margin:4px 0 10px;line-height:1.6}
table.bits,table.qt,table.risk{border-collapse:collapse;margin:6px 0;font-size:13.5px}
table.bits td,table.bits th{border:1px solid var(--line);padding:5px 7px;text-align:center}
table.bits th{background:#f4f6f9;font-weight:600;white-space:nowrap}
table.bits td.on{background:#ffe08a;font-weight:700}table.bits td.p{background:#eee;color:var(--sub)}
table.qt{font-size:13px;margin:10px 0}table.qt td,table.qt th{border:1px solid #9aa3ad;padding:4px 7px;text-align:center;font-weight:400}
table.risk td,table.risk th{border:2px solid #fff;padding:7px 6px;text-align:center;font-size:12.5px}
table.risk th{background:#f4f6f9;font-weight:600}
td.h{background:#f6c3c6}td.m{background:#fde3a7}td.l{background:#cfe9d8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{border:1.5px solid var(--line);border-radius:10px;padding:9px;font-size:13.5px}
.box p{font-size:13.5px!important;line-height:1.6!important}
.box.ok{border-color:var(--ok);background:var(--okbg)}.box.ng{border-color:var(--ng);background:var(--ngbg)}
pre{background:#1b1f24;color:#e8edf3;padding:10px;border-radius:8px;font-size:12px;overflow-x:auto;line-height:1.6}
code{background:#eef1f5;padding:0 4px;border-radius:4px;font-size:.92em}
svg text{fill:var(--ink);font-family:inherit}
.qfig{margin-top:10px;max-width:420px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:#f4f6f9;border-radius:10px;padding:10px 4px}
.stat b{display:block;font-size:22px}.stat small{color:var(--sub);font-size:12px}
.meter{margin:8px 0}.meter .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.meter .track{height:8px;background:#eef1f5;border-radius:4px;overflow:hidden}.meter .track i{display:block;height:100%;background:var(--acc)}
.list div{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.list div:first-child{border-top:0}
.mk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.mk.ok{background:var(--ok)}.mk.ng{background:var(--ng)}
.card .big{font-size:40px;font-weight:800;text-align:center;margin:6px 0 0}
.center{text-align:center}
</style>
</head>
<body>
<div class="top"><div class="row"><span>基本情報 科目A</span><span id="streak"></span></div>
<h1 id="title">ホーム</h1><div class="bar"><i id="prog" style="width:0"></i></div></div>
<main id="app"></main>

<script src="questions.js"></script>
<script>
"use strict";
const KANA = ["ア", "イ", "ウ", "エ"];
const STEPS = [1, 3, 7, 14, 30];   // 正解が続くごとに、次に出すまでの日数をのばす
const KEY = "kihon-a-v1";
const $ = id => document.getElementById(id);

// ---- 記録（この端末の中だけに保存） ----
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
}
const S = Object.assign({ q: {}, days: [] }, load());
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 保存できなくても遊べる */ }
}
function today(offset = 0) {
  const d = new Date(); d.setDate(d.getDate() + offset);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function rec(id) { return S.q[id] || (S.q[id] = { n: 0, ok: 0, step: -1, due: null }); }

function streak() {
  const set = new Set(S.days);
  let n = 0, i = set.has(today()) ? 0 : -1;
  while (set.has(today(i))) { n++; i--; }
  return n;
}

// ---- 出題の選び方：復習の日が来た問題 → まだ解いていない問題 → 前に解いた問題 ----
function dueList() {
  return QUESTIONS.filter(q => { const r = S.q[q.id]; return r && r.due && r.due <= today(); });
}
function pickToday() {
  const due = dueList();
  const fresh = QUESTIONS.filter(q => !S.q[q.id] || !S.q[q.id].n);
  const rest = QUESTIONS.filter(q => !due.includes(q) && !fresh.includes(q))
    .sort((a, b) => (S.q[a.id].last || "").localeCompare(S.q[b.id].last || ""));
  const seen = new Set();
  return [...due, ...fresh, ...rest].filter(q => !seen.has(q.id) && seen.add(q.id)).slice(0, 10);
}

let run = null;   // { list, i, results:[{q, pick}] , mode }

function header(title, ratio) {
  $("title").textContent = title;
  $("prog").style.width = `${Math.round((ratio || 0) * 100)}%`;
  const s = streak();
  $("streak").textContent = s ? `連続 ${s}日` : "";
  window.scrollTo(0, 0);
}

// ---- ホーム ----
function home() {
  run = null;
  header("ホーム", 0);
  const ids = Object.keys(S.q).filter(id => S.q[id].n);
  const tries = ids.reduce((a, id) => a + S.q[id].n, 0);
  const oks = ids.reduce((a, id) => a + S.q[id].ok, 0);
  const due = dueList().length;
  const tags = {};
  for (const q of QUESTIONS) {
    const t = q.tag.split("・")[0], r = S.q[q.id];
    tags[t] = tags[t] || { n: 0, ok: 0 };
    if (r) { tags[t].n += r.n; tags[t].ok += r.ok; }
  }
  const meters = Object.entries(tags).map(([t, v]) => {
    const p = v.n ? Math.round(v.ok / v.n * 100) : 0;
    return `<div class="meter"><div class="lab"><span>${t}</span><span>${v.n ? p + "%" : "まだ"}</span></div><div class="track"><i style="width:${p}%"></i></div></div>`;
  }).join("");
  $("app").innerHTML = `
  <div class="card">
    <div class="stat">
      <div><b>${streak()}</b><small>連続日数</small></div>
      <div><b>${tries ? Math.round(oks / tries * 100) + "%" : "－"}</b><small>正解率</small></div>
      <div><b>${ids.length}<span style="font-size:13px">/${QUESTIONS.length}</span></b><small>解いた問題</small></div>
    </div>
  </div>
  <button class="btn" id="go">今日の${Math.min(10, QUESTIONS.length)}問を始める</button>
  <div style="height:8px"></div>
  <button class="btn sub" id="rev" ${due ? "" : "disabled"}>${due ? `復習する（${due}問）` : "今日の復習はありません"}</button>
  <div style="height:12px"></div>
  <div class="card"><h2>分野ごとの正解率</h2>${meters}</div>
  <p class="src">問題は IPA の公表問題（出典は各問題に記載）。<br>図・解説はこのアプリ独自のものです。記録はこの端末の中だけに保存されます。</p>`;
  $("go").onclick = () => start(pickToday(), "今日の問題");
  $("rev").onclick = () => start(dueList(), "復習");
}

function start(list, mode) {
  run = { list, i: 0, results: [], mode };
  ask();
}

// ---- 問題 ----
function ask() {
  const q = run.list[run.i];
  header(`${run.mode}　${run.i + 1} / ${run.list.length}`, run.i / run.list.length);
  $("app").innerHTML = `
  <div class="card"><span class="tag">${q.area}</span><span class="tag">${q.tag}</span><div class="q">${q.q}</div></div>
  ${q.choices.map((c, i) => `<button class="ch" data-i="${i}"><b>${KANA[i]}</b><span>${c}</span></button>`).join("")}
  <p class="src">出典：${q.src}</p>
  <button class="btn sub" id="quit">ホームにもどる</button>`;
  document.querySelectorAll(".ch").forEach(b => b.onclick = () => answer(+b.dataset.i));
  $("quit").onclick = home;
}

function answer(pick) {
  const q = run.list[run.i], ok = pick === q.ans, r = rec(q.id);
  r.n++; if (ok) r.ok++;
  r.last = today();
  if (ok) {
    r.step = Math.min(r.step + 1, STEPS.length - 1);
    r.due = r.step === 0 && r.n === 1 ? null : today(STEPS[r.step]);   // 1回目で正解なら復習には入れない
  } else {
    r.step = -1; r.due = today(1);
  }
  if (!S.days.includes(today())) S.days.push(today());
  S.days = S.days.slice(-400);
  save();
  run.results.push({ q, pick });
  explain(q, pick);
}

// ---- 解説 ----
function explain(q, pick) {
  const ok = pick === q.ans, last = run.i + 1 >= run.list.length;
  header(`${run.mode}　${run.i + 1} / ${run.list.length}`, (run.i + 1) / run.list.length);
  const choices = q.choices.map((c, i) => {
    const cls = i === q.ans ? "ok" : i === pick ? "ng" : "";
    return `<button class="ch ${cls}" disabled><b>${KANA[i]}</b><span>${c}</span></button>`;
  }).join("");
  const why = q.why.map((w, i) =>
    `<div class="${i === q.ans ? "o" : i === pick ? "me" : ""}"><b>${KANA[i]}</b><span>${w}</span></div>`).join("");
  $("app").innerHTML = `
  <div class="res ${ok ? "ok" : "ng"}"><span>${ok ? "○" : "✕"}</span><div>${ok ? "正解！" : `おしい！ 正解は ${KANA[q.ans]}`}<small>あなたの答え：${KANA[pick]}</small></div></div>
  <details class="card"><summary><h2>📝 問題をもう一度見る</h2></summary><div class="q">${q.q}</div><div style="height:8px"></div>${choices}</details>
  <div class="card"><h2>💡 ひとことで言うと</h2><p class="one">${q.one}</p></div>
  ${q.fig ? `<div class="card"><h2>🗺️ 図で見る</h2>${q.fig}</div>` : ""}
  <div class="card car"><h2>🚗 クルマで言うと</h2>${q.car}</div>
  <div class="card why"><h2>🔍 ア〜エが違う理由</h2>${why}</div>
  <div class="card words"><h2>🔗 関連する言葉</h2>${q.words.map(w => `<span>${w}</span>`).join("")}</div>
  <p class="src">出典：${q.src}<br>（図・解説はこのアプリ独自のものです）</p>
  <div class="nav"><button class="btn sub" id="later">あとで復習</button><button class="btn" id="next">${last ? "結果を見る" : "次の問題へ"}</button></div>`;
  $("later").onclick = e => {
    const r = rec(q.id); r.step = -1; r.due = today(1); save();
    e.target.textContent = "明日もう一度出します"; e.target.disabled = true;
  };
  $("next").onclick = () => { run.i++; last ? finish() : ask(); };
}

// ---- 結果 ----
function finish() {
  header(`${run.mode}　おわり`, 1);
  const okN = run.results.filter(x => x.pick === x.q.ans).length;
  $("app").innerHTML = `
  <div class="card center"><p class="big">${okN} / ${run.results.length}</p><p>${okN === run.results.length ? "全問正解！" : "まちがえた問題は、明日の復習に出てきます。"}</p></div>
  <div class="card list">${run.results.map(x => {
    const ok = x.pick === x.q.ans;
    return `<div><span class="mk ${ok ? "ok" : "ng"}">${ok ? "○" : "✕"}</span><span>${x.q.tag}</span></div>`;
  }).join("")}</div>
  <button class="btn" id="home">ホームにもどる</button>`;
  $("home").onclick = home;
}

home();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body></html>
